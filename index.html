<meta name="claude:viewport-fit-sides" content="cover">
<title>Mental Math Drills</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* Layout: single centered column, two tabs (Practice / Tricks), purple accent on a near-white ground */
  :root{
    --bg:#faf9fc;
    --surface:#ffffff;
    --fg:#1a181f;
    --muted:#6c6678;
    --border:#e7e2f0;
    --accent:#6d28d9;
    --accent-soft:#f1ebfd;
    --good:#1d7a4d;
    --bad:#c0392b;
    --font-display:"Bricolage Grotesque",Georgia,serif;
    --font-ui:"IBM Plex Sans",system-ui,sans-serif;
    --font-num:"IBM Plex Mono",ui-monospace,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#131118;--surface:#1c1a23;--fg:#ece9f2;--muted:#9b94ab;
      --border:#302c3b;--accent:#a78bfa;--accent-soft:#241f33;
      --good:#58c98d;--bad:#f07a6c;color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#131118;--surface:#1c1a23;--fg:#ece9f2;--muted:#9b94ab;
    --border:#302c3b;--accent:#a78bfa;--accent-soft:#241f33;
    --good:#58c98d;--bad:#f07a6c;color-scheme:dark;
  }

  *{box-sizing:border-box}
  body{
    background:var(--bg);color:var(--fg);
    font-family:var(--font-ui);line-height:1.5;
  }
  .wrap{
    max-width:640px;margin:0 auto;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:28px 48px;
  }

  h1{
    font-family:var(--font-display);font-weight:700;
    font-size:clamp(1.7rem,6vw,2.3rem);letter-spacing:-.02em;
    margin:0 0 4px;text-wrap:balance;
  }
  .sub{color:var(--muted);font-size:.95rem;margin:0 0 22px}

  /* tabs */
  .tabs{display:flex;gap:6px;margin-bottom:22px}
  .tab{
    font:inherit;font-weight:600;color:var(--muted);
    background:none;border:none;cursor:pointer;
    padding:8px 2px;border-bottom:2px solid transparent;
  }
  .tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}

  /* chips to pick a drill */
  .chips-label{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 8px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}
  .chip{
    font:inherit;font-size:.86rem;color:var(--fg);cursor:pointer;
    background:var(--surface);border:1px solid var(--border);border-radius:999px;
    padding:6px 13px;transition:background .12s,border-color .12s;
  }
  .chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* play button */
  .play{
    font:inherit;font-weight:600;font-size:1.05rem;
    background:var(--accent);color:#fff;border:none;border-radius:12px;
    padding:14px 24px;cursor:pointer;width:100%;
    transition:filter .12s,transform .05s;
  }
  .play:hover{filter:brightness(1.07)}
  .play:active{transform:translateY(1px)}
  .play:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  /* problem card */
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:22px 20px;margin-top:20px;
  }
  .method{
    display:inline-block;font-weight:600;font-size:.82rem;
    color:var(--accent);background:var(--accent-soft);
    padding:5px 11px;border-radius:999px;margin-bottom:16px;
  }
  .problem{
    font-family:var(--font-num);font-weight:600;
    font-size:clamp(2.2rem,11vw,3.2rem);letter-spacing:-.01em;
    font-variant-numeric:tabular-nums;margin:2px 0 18px;
  }
  .answer-row{display:flex;gap:10px;flex-wrap:wrap}
  .answer-row input{
    font-family:var(--font-num);font-size:1.3rem;font-variant-numeric:tabular-nums;
    flex:1;min-width:0;background:var(--bg);color:var(--fg);
    border:1px solid var(--border);border-radius:10px;padding:10px 14px;
  }
  .answer-row input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
  .check{
    font:inherit;font-weight:600;color:var(--accent);cursor:pointer;
    background:var(--surface);border:1.5px solid var(--accent);border-radius:10px;padding:10px 18px;
  }
  .check:active{transform:translateY(1px)}
  .check:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .feedback{font-weight:600;margin-top:14px;min-height:1.4em}
  .feedback.good{color:var(--good)}
  .feedback.bad{color:var(--bad)}

  .tools{display:flex;gap:16px;align-items:center;margin-top:16px;flex-wrap:wrap}
  .link-btn{
    font:inherit;font-size:.9rem;color:var(--muted);cursor:pointer;
    background:none;border:none;padding:0;text-decoration:underline;text-underline-offset:3px;
  }
  .link-btn:hover{color:var(--accent)}
  .link-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}

  .hint{
    margin-top:16px;padding:14px 16px;border-left:3px solid var(--accent);
    background:var(--accent-soft);border-radius:0 10px 10px 0;font-size:.95rem;
  }
  .hint b{color:var(--accent)}

  .empty{color:var(--muted);text-align:center;padding:30px 0 6px;font-size:.95rem}

  /* slideshow */
  .slide-card{
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:26px 22px;min-height:190px;display:flex;flex-direction:column;justify-content:center;
  }
  .slide-name{font-family:var(--font-display);font-weight:700;font-size:1.3rem;margin:0 0 10px}
  .slide-rule{margin:0 0 14px}
  .slide-eg{
    font-family:var(--font-num);font-size:.95rem;font-variant-numeric:tabular-nums;
    color:var(--muted);background:var(--bg);border:1px solid var(--border);
    border-radius:10px;padding:10px 13px;white-space:pre-line;
  }
  .slide-nav{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
  .arrow{
    font:inherit;font-size:1.3rem;line-height:1;color:var(--fg);cursor:pointer;
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    width:44px;height:44px;display:grid;place-items:center;
  }
  .arrow:hover{border-color:var(--accent);color:var(--accent)}
  .arrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .counter{font-family:var(--font-num);color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <h1>Mental Math Drills</h1>
  <p class="sub">Random problems that tell you which trick to use. Plus a flip-through list of tricks.</p>

  <div class="tabs" role="tablist">
    <button class="tab" id="tab-practice" role="tab" aria-selected="true" aria-controls="panel-practice">Practice</button>
    <button class="tab" id="tab-tricks" role="tab" aria-selected="false" aria-controls="panel-tricks">Tricks</button>
  </div>

  <!-- PRACTICE -->
  <section id="panel-practice" role="tabpanel" aria-labelledby="tab-practice">
    <p class="chips-label">Pick a type, or leave it on Random</p>
    <div class="chips" id="chips"></div>

    <button class="play" id="play">Play ▸</button>

    <div class="card" id="card" hidden>
      <span class="method" id="method"></span>
      <div class="problem" id="problem"></div>
      <div class="answer-row">
        <input id="answer" type="text" inputmode="numeric" autocomplete="off" placeholder="your answer" aria-label="your answer">
        <button class="check" id="check">Check</button>
      </div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="tools">
        <button class="link-btn" id="hintBtn">Hint</button>
        <button class="link-btn" id="showBtn">Show answer</button>
      </div>
      <div class="hint" id="hint" hidden></div>
    </div>

    <p class="empty" id="empty">Hit Play to get a problem.</p>
  </section>

  <!-- TRICKS -->
  <section id="panel-tricks" role="tabpanel" aria-labelledby="tab-tricks" hidden>
    <div class="slide-card">
      <h2 class="slide-name" id="slideName"></h2>
      <p class="slide-rule" id="slideRule"></p>
      <div class="slide-eg" id="slideEg"></div>
    </div>
    <div class="slide-nav">
      <button class="arrow" id="prev" aria-label="Previous trick">‹</button>
      <span class="counter" id="counter"></span>
      <button class="arrow" id="next" aria-label="Next trick">›</button>
    </div>
  </section>
</div>

<script>
(function(){
  "use strict";
  var ri = function(lo,hi){ return Math.floor(Math.random()*(hi-lo+1))+lo; };
  var pad2 = function(x){ return ("0"+x).slice(-2); };

  // ---- the drillable problem types ----
  var TYPES = {
    two11: {
      label:"2-digit × 11",
      method:"Two-digit number × 11",
      gen:function(){
        var a=ri(10,99), ans=a*11, t=Math.floor(a/10), o=a%10, s=t+o, hint;
        if(s<10){
          hint="Add the two digits of "+a+": <b>"+t+" + "+o+" = "+s+"</b>. Drop it in the middle → "+t+" "+s+" "+o+" = <b>"+ans+"</b>.";
        } else {
          hint="Add the two digits of "+a+": <b>"+t+" + "+o+" = "+s+"</b>. That's two digits, so write the "+(s%10)+" and carry the 1 left: "+t+" + 1 = "+(t+1)+". → <b>"+ans+"</b>.";
        }
        return {display:a+" × 11", answer:ans, hint:hint};
      }
    },
    three11:{
      label:"3-digit × 11",
      method:"Three-digit number × 11",
      gen:function(){
        var a=ri(100,999), ans=a*11;
        var d1=Math.floor(a/100), d2=Math.floor(a/10)%10, d3=a%10;
        var hint="Keep the first digit ("+d1+") and last digit ("+d3+"). For the middle, add each side-by-side pair: <b>"+d1+"+"+d2+"="+(d1+d2)+"</b> and <b>"+d2+"+"+d3+"="+(d2+d3)+"</b>. Place them in, carrying left whenever a sum hits 10 or more. → <b>"+ans+"</b>.";
        return {display:a+" × 11", answer:ans, hint:hint};
      }
    },
    sq2:{
      label:"Square ⋯5 (2-digit)",
      method:"Squaring a two-digit number ending in 5",
      gen:function(){
        var t=ri(1,9), n=t*10+5, ans=n*n;
        var hint="Take the first digit <b>"+t+"</b>, times the next number up <b>"+(t+1)+"</b>: "+t+"×"+(t+1)+"="+(t*(t+1))+". Stick 25 on the end → <b>"+ans+"</b>.";
        return {display:n+"²", answer:ans, hint:hint};
      }
    },
    sq3:{
      label:"Square ⋯5 (3-digit)",
      method:"Squaring a three-digit number ending in 5",
      gen:function(){
        var h=ri(10,99), n=h*10+5, ans=n*n;
        var hint="Take <b>"+h+"</b> (the number without the last 5), times the next number up <b>"+(h+1)+"</b>: "+h+"×"+(h+1)+"="+(h*(h+1))+". Attach 25 → <b>"+ans+"</b>.";
        return {display:n+"²", answer:ans, hint:hint};
      }
    },
    same10:{
      label:"Same first, last add to 10",
      method:"Same first digit, last digits add to 10",
      gen:function(){
        var f=ri(1,9), a1=ri(1,9), a2=10-a1;
        var n1=f*10+a1, n2=f*10+a2, ans=n1*n2;
        var start=f*(f+1), lastp=a1*a2;
        var hint="First digit <b>"+f+"</b> times the next number up <b>"+(f+1)+"</b> = "+start+". Then attach the last digits multiplied: "+a1+"×"+a2+"="+lastp+", as two digits ("+pad2(lastp)+"). → <b>"+ans+"</b>.";
        return {display:n1+" × "+n2, answer:ans, hint:hint};
      }
    },
    teen1:{
      label:"11–19 × single digit",
      method:"A number from 11 to 19 × a single digit",
      gen:function(){
        var t=ri(11,19), s=ri(2,9), ans=t*s, o=t%10;
        var hint=s+" × 10 = "+(s*10)+". "+s+" × "+o+" = "+(s*o)+". Add them: <b>"+(s*10)+" + "+(s*o)+" = "+ans+"</b>.";
        return {display:t+" × "+s, answer:ans, hint:hint};
      }
    },
    bothteen:{
      label:"Both 10–20",
      method:"Two numbers both between 10 and 20",
      gen:function(){
        var a=ri(11,19), b=ri(11,19), ans=a*b;
        var bo=b%10, step=(a+bo)*10, lastp=(a%10)*(b%10);
        var hint="Take "+a+" and add "+b+"'s last digit ("+bo+"): "+a+"+"+bo+"="+(a+bo)+". Times 10 → "+step+". Then add the last digits multiplied: "+(a%10)+"×"+(b%10)+"="+lastp+". <b>"+step+" + "+lastp+" = "+ans+"</b>.";
        return {display:a+" × "+b, answer:ans, hint:hint};
      }
    }
  };
  var ORDER = ["two11","three11","sq2","sq3","same10","teen1","bothteen"];

  // ---- state ----
  var mode = "random";
  var current = null;

  // ---- build chips ----
  var chips = document.getElementById("chips");
  function makeChip(key,label){
    var b=document.createElement("button");
    b.className="chip"; b.textContent=label;
    b.setAttribute("aria-pressed", key===mode ? "true":"false");
    b.addEventListener("click",function(){
      mode=key;
      Array.prototype.forEach.call(chips.children,function(c){
        c.setAttribute("aria-pressed", c===b ? "true":"false");
      });
    });
    return b;
  }
  chips.appendChild(makeChip("random","Random"));
  ORDER.forEach(function(k){ chips.appendChild(makeChip(k,TYPES[k].label)); });

  // ---- practice refs ----
  var card=document.getElementById("card");
  var empty=document.getElementById("empty");
  var methodEl=document.getElementById("method");
  var problemEl=document.getElementById("problem");
  var answerEl=document.getElementById("answer");
  var feedbackEl=document.getElementById("feedback");
  var hintEl=document.getElementById("hint");
  var hintBtn=document.getElementById("hintBtn");
  var showBtn=document.getElementById("showBtn");

  function play(){
    var key = mode==="random" ? ORDER[ri(0,ORDER.length-1)] : mode;
    current = TYPES[key].gen();
    methodEl.textContent = TYPES[key].method;
    problemEl.textContent = current.display;
    answerEl.value="";
    feedbackEl.textContent=""; feedbackEl.className="feedback";
    hintEl.innerHTML=current.hint; hintEl.hidden=true; hintBtn.textContent="Hint";
    empty.hidden=true; card.hidden=false;
    answerEl.focus();
  }
  function check(){
    if(!current) return;
    var val=answerEl.value.replace(/[,\s]/g,"");
    if(val===""){ feedbackEl.textContent="Type an answer first."; feedbackEl.className="feedback"; return; }
    if(parseInt(val,10)===current.answer){
      feedbackEl.textContent="Correct ✓"; feedbackEl.className="feedback good";
    } else {
      feedbackEl.textContent="Not quite — try again."; feedbackEl.className="feedback bad";
    }
  }
  document.getElementById("play").addEventListener("click",play);
  document.getElementById("check").addEventListener("click",check);
  answerEl.addEventListener("keydown",function(e){ if(e.key==="Enter") check(); });
  hintBtn.addEventListener("click",function(){
    hintEl.hidden=!hintEl.hidden;
    hintBtn.textContent=hintEl.hidden?"Hint":"Hide hint";
  });
  showBtn.addEventListener("click",function(){
    if(!current) return;
    feedbackEl.textContent="Answer: "+current.answer; feedbackEl.className="feedback";
  });

  // ---- tricks slideshow ----
  var TRICKS=[
    {name:"Multiplying by 9",
     rule:"The first digit is one less than the number you're multiplying by, and the two digits add up to 9.",
     eg:"9 × 4 → starts with 3 (one less than 4).\n3 + 6 = 9, so the answer is 36."},
    {name:"Multiplying by 2 is just doubling",
     rule:"Multiplying by 2 is the same as adding a number to itself.",
     eg:"6 × 2 is the same as 6 + 6 = 12."},
    {name:"Multiplying by 5",
     rule:"Every answer ends in 5 or 0. Quick way: multiply by 10, then halve.",
     eg:"8 × 5 → 8 × 10 = 80, then halve → 40."},
    {name:"Round up and subtract",
     rule:"When a number is just under a round one, treat it as the round number minus a bit.",
     eg:"7 × 19 → treat 19 as 20 − 1.\n7 × 20 = 140, minus 7 = 133."},
    {name:"Attaching zeros",
     rule:"Multiplying by 10, 100 or 1000 just adds that many zeros on the end.",
     eg:"42 × 100 = 4200 (two zeros added)."}
  ];
  var idx=0;
  var slideName=document.getElementById("slideName");
  var slideRule=document.getElementById("slideRule");
  var slideEg=document.getElementById("slideEg");
  var counter=document.getElementById("counter");
  function renderSlide(){
    var t=TRICKS[idx];
    slideName.textContent=t.name;
    slideRule.textContent=t.rule;
    slideEg.textContent=t.eg;
    counter.textContent=(idx+1)+" / "+TRICKS.length;
  }
  document.getElementById("prev").addEventListener("click",function(){ idx=(idx-1+TRICKS.length)%TRICKS.length; renderSlide(); });
  document.getElementById("next").addEventListener("click",function(){ idx=(idx+1)%TRICKS.length; renderSlide(); });
  renderSlide();

  // ---- tabs ----
  var tabP=document.getElementById("tab-practice"), tabT=document.getElementById("tab-tricks");
  var panelP=document.getElementById("panel-practice"), panelT=document.getElementById("panel-tricks");
  function select(which){
    var p = which==="practice";
    tabP.setAttribute("aria-selected",p?"true":"false");
    tabT.setAttribute("aria-selected",p?"false":"true");
    panelP.hidden=!p; panelT.hidden=p;
  }
  tabP.addEventListener("click",function(){ select("practice"); });
  tabT.addEventListener("click",function(){ select("tricks"); });
})();
</script>
